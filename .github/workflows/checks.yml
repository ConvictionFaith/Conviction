# Runs on every change. Catches broken theme code and leaked secrets
# before they can reach the live store.
name: Theme checks

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  theme-check:
    name: Shopify theme check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Install Shopify CLI
        run: npm install -g @shopify/cli@3
      - name: Check theme (fails on errors only)
        run: shopify theme check --fail-level error

  json-and-liquid:
    name: JSON and Liquid sanity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Validate JSON files and Liquid tag balance
        run: python3 .github/scripts/sanity.py

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Look for keys, tokens and passwords
        run: python3 .github/scripts/secrets.py
